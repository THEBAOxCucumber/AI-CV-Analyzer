# Security headers สำหรับ AI CV Analyzer — ระดับ http (ใช้กับทุก site บน VPS นี้)
#
# ติดตั้ง (บน VPS, root) — ไม่ต้องแก้ไฟล์ site ที่ certbot แก้ไปแล้ว:
#   cp nginx-security.conf /etc/nginx/conf.d/ai-cv-security.conf
#   sed -i 's/^\(\s*\)server_tokens [a-z]*;/\1server_tokens off;/' /etc/nginx/nginx.conf
#   nginx -t && systemctl reload nginx
#
# location ใดที่ตั้ง add_header เอง จะไม่สืบทอดค่าจากไฟล์นี้ (กฎของ Nginx)
# — deploy/nginx.conf ไม่มี add_header จึงได้ครบ

# เลขเวอร์ชัน Nginx: ตั้ง server_tokens ใน /etc/nginx/nginx.conf
# (Ubuntu ตั้งไว้แล้ว — ประกาศซ้ำที่นี่ nginx -t ไม่ผ่าน "directive is duplicate")
#   sed -i 's/^\(\s*\)server_tokens [a-z]*;/\1server_tokens off;/' /etc/nginx/nginx.conf

# header ที่แอปตั้งเองแล้ว (เช่น /admin) → ใช้ค่าของแอป ไม่ส่งซ้ำ
# ค่าว่าง = Nginx ไม่ส่ง header นั้น
map $upstream_http_x_frame_options $ai_cv_x_frame_options {
    ""      "DENY";
    default "";
}

map $upstream_http_referrer_policy $ai_cv_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

map $upstream_http_x_content_type_options $ai_cv_x_content_type_options {
    ""      "nosniff";
    default "";
}

# บังคับ HTTPS 1 ปี (เบราว์เซอร์ใช้เฉพาะเมื่อได้รับผ่าน HTTPS)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options $ai_cv_x_frame_options always;
add_header Referrer-Policy $ai_cv_referrer_policy always;
add_header X-Content-Type-Options $ai_cv_x_content_type_options always;
# แอปไม่ใช้กล้อง / ไมค์ / ตำแหน่ง
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
