# Nginx reverse proxy สำหรับ AI CV Analyzer
#
# ติดตั้ง (บน VPS, root):
#   แก้ cv.example.com เป็นโดเมนจริง (2 ที่) แล้ว
#   cp nginx.conf /etc/nginx/sites-available/ai-cv-analyzer
#   ln -s /etc/nginx/sites-available/ai-cv-analyzer /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cv.example.com --redirect      # เพิ่ม HTTPS ให้อัตโนมัติ
#
# แอปฟังที่ 127.0.0.1:3310 (APP_PORT ใน .env) — ไม่ชนกับแอป Lab ที่ 3300

server {
    listen 80;
    listen [::]:80;
    server_name cv.example.com;

    # อัปโหลด Resume PDF สูงสุด 5 MB (+ เผื่อ multipart)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # backend ใช้ IP จริงทำ rate limit (TRUST_PROXY=1)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ค้นหางาน (Careerjet) ใช้ได้ถึง ~25 วินาที — งาน AI วิ่งในคิว ไม่ค้าง request
        proxy_read_timeout 60s;
    }
}
