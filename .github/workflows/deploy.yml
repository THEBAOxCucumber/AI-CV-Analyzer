# Deploy: หลัง CI ผ่านบน main (หรือกด Run workflow เอง)
#
#   1) build image → GHCR (Private) tag latest + sha-xxxxxxx
#        ghcr.io/<owner>/<repo>            แอป (เว็บ + API + worker)
#        ghcr.io/<owner>/<repo>-migrator   migration
#   2) SSH เข้า VPS → docker compose pull + up -d → รอ health
#
# ใช้ GITHUB_TOKEN push image (ไม่ต้องสร้าง token เอง)
# Secrets ที่ต้องตั้ง (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  — ยังไม่ตั้ง = ข้ามขั้น deploy (build/push ยังทำ)
# Variables (ไม่บังคับ):
#   VPS_APP_DIR        โฟลเดอร์แอปบน VPS (ค่าเริ่มต้น ~/ai-cv-analyzer)
#   VITE_API_BASE_URL  ฝังตอน build หน้าเว็บ (ว่าง = /api โดเมนเดียวกัน)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push image
    # CI ต้องผ่าน และต้องเป็น push เข้า main (ไม่ใช่ PR จาก fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # commit เดียวกับที่ CI ทดสอบผ่าน
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "app=$image" >> "$GITHUB_OUTPUT"
          echo "migrator=$image-migrator" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.app }}:latest
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build & push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.meta.outputs.migrator }}:latest
            ${{ steps.meta.outputs.migrator }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ยังไม่ได้ตั้ง Secrets ของ VPS → ข้าม (job ไม่ fail)
      - name: Check VPS secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่ได้ตั้ง VPS_HOST / VPS_USER / VPS_SSH_KEY — ข้ามขั้น deploy"
          fi

      - name: Pull & restart on VPS
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ vars.VPS_APP_DIR || '~/ai-cv-analyzer' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -eu
            cd "$(eval echo "$APP_DIR")"

            docker compose pull
            docker compose up -d

            # รอ app healthy (HEALTHCHECK ใน image เรียก /api/health ที่ตรวจ DB จริง)
            app=$(docker compose ps -q app)
            for i in $(seq 1 40); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$app")
              echo "app health: $status"
              [ "$status" = "healthy" ] && break
              sleep 3
            done

            docker compose ps
            [ "$status" = "healthy" ] || { docker compose logs --tail=80 app; exit 1; }

            # ลบ image เก่าที่ไม่ใช้แล้ว (ไม่แตะ volume)
            docker image prune -f
