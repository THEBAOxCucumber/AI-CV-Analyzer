# ตรวจโค้ดทุกครั้งที่ push / เปิด PR เข้า main
#
# frontend: lint → typecheck + build → test (Vitest)
# backend : typecheck → สร้าง schema จาก migrations → integration test
#   ใช้ MySQL / Redis / Qdrant เวอร์ชันเดียวกับ docker-compose.yml
#   Ollama ถูก mock ในเทสต์ — API key ภายนอกเป็นค่าหลอก (เทสต์ไม่เรียกจริง)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ai_resume_analyzer_test
          MYSQL_USER: resume_user
          MYSQL_PASSWORD: resume_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: resume_user
      DB_PASSWORD: resume_password
      DB_NAME: ai_resume_analyzer_test
      REDIS_HOST: 127.0.0.1
      QDRANT_URL: http://127.0.0.1:6333
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      GEMINI_API_KEY: ci-dummy
      JOOBLE_API_KEY: ci-dummy
      CAREERJET_API_KEY: ci-dummy

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run type-check

      # image qdrant ไม่มี curl ให้ทำ health check → รอจากฝั่ง runner
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant not ready" >&2
          exit 1

      - name: Create schema from migrations
        run: npm run db:create-schema

      - name: Test
        run: npm test
